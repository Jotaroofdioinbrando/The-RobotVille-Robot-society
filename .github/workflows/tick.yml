name: Robotville Tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Avançar um ciclo da simulação
        run: |
          curl -sf -X POST "${{ vars.ROBOTVILLE_URL }}/api/tick" \
            -H "x-tick-secret: ${{ secrets.TICK_SECRET }}"
